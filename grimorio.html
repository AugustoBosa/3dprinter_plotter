<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrolls e grimórios para plotter</title>
<style>
:root { --cinza: #e7e7e3; --tinta: #1d1d1b; --borda: #c9c9c2; --erro: #b00020; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--cinza); color: var(--tinta); font: 15px/1.4 system-ui, sans-serif; }
header { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--borda); }
h1 { margin: 0; font-size: 20px; }
.erro { margin: 4px 0 0; color: var(--erro); font-weight: 600; }
.erro:empty { display: none; }
main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
.esquerda { max-height: calc(100vh - 110px); overflow-y: auto; background: #fff; border: 1px solid var(--borda); border-radius: 6px; padding: 0 12px; }
details { border-bottom: 1px solid var(--borda); padding: 8px 0; }
details:last-child { border-bottom: 0; }
summary { font-weight: 700; cursor: pointer; padding: 4px 0; }
h3 { font-size: 14px; margin: 14px 0 4px; }
label { display: block; margin: 6px 0; }
label.slider { display: grid; grid-template-columns: 1fr 1.3fr 3.2em; align-items: center; gap: 8px; }
label.slider output { text-align: right; font-variant-numeric: tabular-nums; }
input, select, textarea, button { font: inherit; }
input[type=range] { width: 100%; }
input[type=number] { width: 6.5em; max-width: 100%; }
select { max-width: 100%; }
textarea { width: 100%; }
button { padding: 4px 10px; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
input[type=text] { max-width: 100%; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.ajuda { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 2px; border: 1px solid #777; border-radius: 50%; background: #fff; color: #555; font-size: 11px; font-weight: 700; line-height: 1; cursor: help; vertical-align: middle; user-select: none; }
.ajuda::after { content: attr(data-ajuda); display: none; position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(calc(-50% + var(--dx, 0px))); width: 220px; padding: 6px 8px; border-radius: 4px; background: var(--tinta); color: #fff; font-size: 12px; font-weight: 400; line-height: 1.35; text-align: left; white-space: normal; pointer-events: none; z-index: 30; }
.ajuda:hover::after, .ajuda:focus::after { display: block; }
.ajuda:focus { outline: 2px solid #1b5fc4; outline-offset: 1px; }
.direita { min-width: 0; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.barra label { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
.paginas { display: flex; align-items: center; gap: 8px; margin-left: auto; }
#previas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
#previas.comparando { grid-template-columns: repeat(2, minmax(0, 1fr)); }
figure { margin: 0; min-width: 0; }
.rotulo { margin: 0 0 6px; font-weight: 600; color: #444; }
.folha { background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
.folha svg { display: block; width: 100%; height: auto; }
#avisos { margin: 12px 0 0; padding-left: 20px; color: #6b4300; }
#avisos:empty { display: none; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; }
  .esquerda { max-height: none; overflow: visible; }
  #previas, #previas.comparando { grid-template-columns: 1fr; }
  .paginas { margin-left: 0; }
}
header nav { float: right; }
input[type=search], input[type=text] { width: 100%; }
.achados { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; max-height: 180px; overflow-y: auto; }
.achados button { font-size: 13px; padding: 2px 6px; }
.selecionadas { padding-left: 22px; margin: 4px 0; }
.selecionadas li { display: flex; gap: 4px; margin: 3px 0; }
.selecionadas .nome { flex: 1; text-align: left; }
.selecionadas .atual .nome { font-weight: 700; border-color: var(--tinta); }
.folha { margin: 0 auto; }
#avisos { list-style: none; padding-left: 0; }
dialog { border: 1px solid var(--borda); border-radius: 6px; max-width: 95vw; }
.tela { display: block; width: min(70vw, 360px); max-height: 60vh; background: #fff; border: 1px solid var(--borda); touch-action: none; cursor: crosshair; }
.tela polyline { fill: none; stroke: var(--tinta); stroke-width: var(--traco); stroke-linecap: round; stroke-linejoin: round; }
.tela .guia { fill: none; stroke: #c9c9c2; stroke-width: calc(var(--traco) / 2); stroke-dasharray: calc(var(--traco) * 2); }
</style>
</head>
<body>
<header>
  <nav><a href="index.html">Caligrafia</a></nav>
  <h1>Scrolls e grimórios</h1>
  <p id="erro" class="erro"></p>
</header>
<main>
  <aside class="esquerda">
    <details open><summary>Magias</summary><div id="painel-magias"></div></details>
    <details><summary>Editar magia</summary><div id="painel-editar"></div></details>
    <details open><summary>Folha</summary><div id="painel-folha"></div></details>
    <details open><summary>Escrita</summary><div id="painel-escrita"></div></details>
    <details><summary>Exportar</summary><div id="painel-exportar"></div></details>
  </aside>
  <section class="direita">
    <div class="barra">
      <nav class="paginas">
        <button type="button" id="pag-ant">&larr; Anterior</button>
        <span id="pag-info">Página 1 de 1</span>
        <button type="button" id="pag-prox">Próxima &rarr;</button>
      </nav>
    </div>
    <div class="folha" id="previa"></div>
    <ul id="avisos"></ul>
  </section>
</main>
<dialog id="editor"></dialog>
<script type="module">
import { iniciar } from './src/ui-grimorio.js';
iniciar();
</script>
</body>
</html>
